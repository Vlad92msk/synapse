    <circle cx="140" cy="45" r="14" stroke="url(#orangeGradient)" stroke-width="8" fill="none" />
    <circle cx="140" cy="155" r="14" stroke="url(#orangeGradient)" stroke-width="8" fill="none" />
  </g>

  <line x1="92.1" y1="77.9" x2="120.2" y2="58.6" stroke="url(#orangeGradient)" stroke-width="6" stroke-linecap="round" />
  <line x1="92.1" y1="122.1" x2="120.2" y2="141.4" stroke="url(#orangeGradient)" stroke-width="6" stroke-linecap="round" />
