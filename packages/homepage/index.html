  <h1>Synapse Storage</h1>
  <p>
    Framework-agnostic TypeScript toolkit for state management and API requests. Three independent layers:
    a core state manager (memory / localStorage / IndexedDB adapters, selectors, subscriptions, RxJS),
    a business-logic layer (<code>createSynapse</code>: dispatcher + effects), and an API client with
    React hooks (useQuery / useMutation) and SSR support.
  </p>
