<!doctype html>
<html><head><meta charset="utf-8"><title>Scene3D preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
  html,body{margin:0;background:#111;color:#ddd;font:13px Inter,sans-serif}
  #wrap{position:relative;width:1920px;height:1080px;transform-origin:0 0;background:#232321;overflow:hidden}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;background:#000c;display:flex;gap:10px;align-items:center;z-index:9}
  #t{flex:1}
</style></head><body>
<!-- Превью сцены без рендера видео: ползунок времени, пробел — пуск/пауза. Тайминги — из dist/plan.js
     (пишет render.mjs при каждом запуске), иначе — тестовые. Собрать: npm run build (или npm run watch). -->
<div id="wrap"></div>
<div id="ui"><button id="play">▶</button><input id="t" type="range" min="0" max="120" step="0.01" value="0"><span id="lbl"></span></div>
<script src="dist/plan.js" onerror="void 0"></script>
<script src="dist/scene3d.js"></script>
<script>
const slides = window.SCENE3D_PLAN ?? [
  { id: 'real-one', start: 0, trans: 0.7, end: 40, steps: { 0: 0.7, 2: 12, 3: 20, 4: 27, 5: 34 } },
  { id: 'real-module', start: 40, trans: 2.6, end: 80, steps: { 1: 42.6, 2: 52, 3: 57, 4: 63, 5: 68, 6: 73 } },
  { id: 'real-app', start: 80, trans: 2.6, end: 112, steps: { 0: 80, 1: 88, 2: 95, 3: 102 } },
]
const wrap = document.getElementById('wrap')
const fit = () => { wrap.style.transform = `scale(${Math.min(innerWidth / 1920, (innerHeight - 40) / 1080)})` }
fit(); addEventListener('resize', fit)
const sc = Scene3D.mount(wrap, { width: 1920, height: 1080, slides })
const r = document.getElementById('t'), lbl = document.getElementById('lbl')
r.min = Math.min(...slides.map((s) => s.start)); r.max = Math.max(...slides.map((s) => s.end)); r.value = r.min
const show = () => { const t = +r.value; sc.seek(t); const s = slides.findLast((s) => s.start <= t); lbl.textContent = t.toFixed(2) + ' с · ' + (s?.id ?? '') }
r.oninput = show; show()
let playing = false, last = 0
const loop = (now) => { if (!playing) return; r.value = +r.value + (now - last) / 1000; last = now; show(); requestAnimationFrame(loop) }
const toggle = () => { playing = !playing; document.getElementById('play').textContent = playing ? '❚❚' : '▶'; if (playing) { last = performance.now(); requestAnimationFrame(loop) } }
document.getElementById('play').onclick = toggle
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); toggle() } })
</script></body></html>
